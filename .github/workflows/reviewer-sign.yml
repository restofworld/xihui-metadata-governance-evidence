name: Metadata reviewer signature

on:
  workflow_dispatch:
    inputs:
      manifest_url:
        description: Immutable raw GitHub URL for the unsigned manifest
        required: true
        type: string
      manifest_sha256:
        description: Expected lowercase SHA-256 of the unsigned manifest
        required: true
        type: string

permissions:
  contents: read

jobs:
  review-sign:
    runs-on: ubuntu-latest
    environment: metadata-reviewer
    steps:
      - name: Sign with the isolated reviewer key
        id: reviewer_sign
        uses: restofworld/xihui-metadata-governance-evidence/.github/actions/reviewer-sign@c6109fea6018a5a7376a48f750e2f61dd2460901
        with:
          manifest-url: ${{ inputs.manifest_url }}
          manifest-sha256: ${{ inputs.manifest_sha256 }}
          expected-public-key-sha256: 11cca3713d9b5b8d6af7fbcd5248584d6ae09157faae6563e47e2979dac5ea1c
          expected-key-id: xihui-governance-review-2026-08-26
          expected-issuer: restofworld/xihui-governance
          private-key: ${{ secrets.METADATA_REVIEW_PRIVATE_KEY }}

      - name: Upload reviewer-signed manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: metadata-reviewer-signature-${{ github.run_id }}
          path: ${{ runner.temp }}/manifest.reviewed.json
          if-no-files-found: error
          retention-days: 7
